# One interface, one message: header with sync/id/length, CRC32 trailer, enum, nested struct,
# dynamic array (count may be 0), min/max/default.
schema_version: 1
project: basic_telemetry
version: "0.1.0"
description: Minimal sensor telemetry link (rx only).
namespace: demo::telemetry
defaults: { endian: big, bit_order: msb_first }

requirements:
  HLR-SNS-001:
    text: The sensor link shall deliver every valid sensor reading to the application.
    source: ICD-SNS-001 §3.1
  HLR-SNS-004:
    text: The sensor link shall reject readings outside the sensor's calibrated range.
    source: ICD-SNS-001 §4.2
  HLR-SNS-005:
    text: Every frame of the sensor link shall be protected by a CRC-32.
    source: ICD-SNS-001 §5.1
  HLR-SNS-006:
    text: The sensor link shall find the next frame after corrupted or lost data.
    source: ICD-SNS-001 §5.2
    verification: analysis

checksums:
  frameCrc: { algo: crc32, reqs: [HLR-SNS-005] }

enums:
  SensorState:
    type: u8
    values: { off: 0, warming: 1, ready: 2, fault: 3 }   # `off` stays a string (YAML 1.2)

types:
  Vec3:
    description: Three-axis sample.
    fields:
      - { name: x, type: f32, default: 0.0 }
      - { name: y, type: f32, default: 0.0 }
      - { name: z, type: f32, default: 0.0 }

messages:
  SensorReading:
    id: 0x0101
    description: Periodic sensor sample.
    reqs: [HLR-SNS-001]
    fields:
      - { name: sensorId, type: u8, min: 1, max: 32, default: 1 }
      - { name: state, type: SensorState, default: ready }
      - { name: temperature, type: f32, min: -80.0, max: 150.0, default: 20.0, units: degC, reqs: [HLR-SNS-004] }
      - { name: accel, type: Vec3 }
      - { name: sampleCount, type: u8, max: 4 }
      - name: samples
        type: u16
        occurs: { max: 4, count: sampleCount }

interfaces:
  sensor_to_us:
    version: "1.0.0"
    reqs: [HLR-SNS-001]
    direction: rx
    header:
      fields:
        - { name: sync, type: u16, const: 0xA55A, role: sync }
        - { name: msgId, type: u16, role: message_id }
        - { name: length, type: u16, role: payload_length }
    trailer:
      fields:
        - name: crc
          type: u32
          checksum: { use: frameCrc, covers: { scope: header_and_payload } }
    framing: { kind: sync_length, max_frame_size: 64, resync: true, reqs: [HLR-SNS-006] }
    messages: [SensorReading]

vectors:
  reading_nominal:
    description: Nominal reading, payload only.
    message: SensorReading
    direction: both
    bytes: "03 02 41AC0000 3F800000 00000000 BF800000 02 0001 0002"
    expect:
      fields:
        sensorId: 3
        state: ready
        temperature: 21.5
        accel: { x: 1.0, y: 0.0, z: -1.0 }
        samples: [1, 2]
    reqs: [HLR-SNS-001]
  reading_sensor_id_out_of_range:
    description: Sensor id 33 is above the 32 sensors of the link.
    message: SensorReading
    bytes: "21 02 41AC0000 3F800000 00000000 BF800000 02 0001 0002"
    expect: { status: OutOfRange }
    reqs: [HLR-SNS-004]
  frame_nominal:
    description: The same reading in a complete frame.
    interface: sensor_to_us
    message: SensorReading
    bytes: "A55A 0101 0017 03 02 41AC0000 3F800000 00000000 BF800000 02 0001 0002 D86BDABD"
    expect:
      fields: { sensorId: 3, state: ready, samples: [1, 2] }
    reqs: [HLR-SNS-001]
  frame_bad_checksum:
    description: The last checksum byte is inverted.
    interface: sensor_to_us
    message: SensorReading
    bytes: "A55A 0101 0017 03 02 41AC0000 3F800000 00000000 BF800000 02 0001 0002 D86BDA42"
    expect: { status: ChecksumMismatch }
    reqs: [HLR-SNS-005]

