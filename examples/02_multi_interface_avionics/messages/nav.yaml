schema_version: 1
messages:
  NavSolution:
    id: 0x0201
    description: Position solution sent to nodeA.
    bit_order: lsb_first
    fields:
      - { name: flags, type: NavFlags }
      - { name: hasAlt, type: bool }
      - name: alt
        type: i16
        min: -500
        max: 20000
        units: m
        occurs: { max: 1, count: hasAlt }
      - { name: lat, type: f64, min: -90.0, max: 90.0, default: 0.0, units: deg }
      - { name: lon, type: f64, min: -180.0, max: 180.0, default: 0.0, units: deg }
      - { name: trackCount, type: u8, max: MAX_TRACKS }
      - name: tracks
        type: TrackRef
        occurs: { max: MAX_TRACKS, count: trackCount }
      - { name: extra, type: u8, if: defined(PLATFORM_B) }
      - { name: ratio, type: f32, min: 0.0, max: 1.0, default: 0.0 }
