schema_version: 1
enums:
  NavMode:
    type: u8
    values: { init: 0, align: 1, navigate: 2, degraded: 3, fault: 4, test: 5 }

types:
  NavFlags:
    description: Bit group, 8 bits total.
    fields:
      - { name: valid, type: bool, bits: 1, default: false }
      - { name: mode, type: NavMode, bits: 3, default: init }
      - { name: spare, type: u8, bits: 4, reserved: true }
  TrackRef:
    fields:
      - { name: id, type: u16 }
      - { name: quality, type: u8, min: 0, max: 100, default: 0 }
