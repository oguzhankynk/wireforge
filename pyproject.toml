[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wireforge"
dynamic = ["version"]
description = "Match your wire format byte for byte: define the interface, generate heap-free C99 and C++17 code with its tests."
requires-python = ">=3.10"
license = "BUSL-1.1 AND MIT"
license-files = ["LICENSE", "runtime/LICENSE"]
authors = [{ name = "Oguzhan KAYNAK" }]
readme = "README.md"
keywords = [
  "binary protocol", "code generator", "serialization", "embedded", "mavlink", "mavlink2", "drone",
  "modbus", "can", "j1939", "icd", "wireshark", "c++17", "c99", "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C",
  "Programming Language :: C++",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Networking",
]
dependencies = [
  "ruamel.yaml>=0.18",
  "jsonschema>=4.21",
  "referencing>=0.30",
  "typing_extensions>=4.4",
]

[project.urls]
Homepage = "https://github.com/oguzhankynk/wireforge"
Tutorial = "https://github.com/oguzhankynk/wireforge/blob/master/docs/tutorial/README.md"
Documentation = "https://github.com/oguzhankynk/wireforge/blob/master/docs/GUIDE.md"
Video = "https://youtu.be/o5CbrNqxPiI"
Issues = "https://github.com/oguzhankynk/wireforge/issues"
Changelog = "https://github.com/oguzhankynk/wireforge/releases"

[project.scripts]
wireforge = "wireforge.cli:_entry"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
oidc = ["joserfc>=1.0"]
mcp = ["mcp>=2.3"]
import = ["openpyxl>=3.1"]
dev = [
  "pytest>=8",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "types-jsonschema",
  "gcovr>=7",
  "clang-tidy==18.1.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx2>=2.13",
  "mcp>=2.3",
  "openpyxl>=3.1",
  "joserfc>=1.0",
  "types-openpyxl",
  "pymodbus==3.16.1",
  "cantools==45.0.0",
  "pyubx2==1.3.8",
  "pymavlink==2.4.50",
  "crsf-parser==0.3.2",
]

[tool.setuptools.dynamic]
version = { attr = "wireforge.__version__" }

[tool.setuptools]
package-dir = { "" = "codegen" }
packages = ["wireforge", "wireforge.server"]

[tool.setuptools.package-data]
wireforge = ["py.typed", "wireshark_runtime.lua", "templates/*/project.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["codegen", "tests/python", "quality"]
extend-exclude = ["build", "ui/node_modules"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "D104", "D100", "CPY001", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/python/**" = ["S101", "PLR2004", "D103", "INP001"]
"examples/tutorial/**" = ["INP001", "T201"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["codegen", "quality", "tests/python"]
mypy_path = "codegen:quality"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
filterwarnings = ["error"]
pythonpath = ["codegen"]
