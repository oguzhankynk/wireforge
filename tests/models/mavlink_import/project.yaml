D_NAV_SET_YAW_SPEED: 213, MAV_CMD_DO_SET_CAM_TRIGG_INTERVAL: 214, MAV_CMD_DO_MOUNT_CONTROL_QUAT: 220, MAV_CMD_DO_GUIDED_MASTER: 221, MAV_CMD_DO_GUIDED_LIMITS: 222, MAV_CMD_DO_ENGINE_CONTROL: 223, MAV_CMD_DO_SET_MISSION_CURRENT: 224, MAV_CMD_DO_LAST: 240, MAV_CMD_PREFLIGHT_CALIBRATION: 241, MAV_CMD_PREFLIGHT_SET_SENSOR_OFFSETS: 242, MAV_CMD_PREFLIGHT_UAVCAN: 243, MAV_CMD_PREFLIGHT_STORAGE: 245, MAV_CMD_PREFLIGHT_REBOOT_SHUTDOWN: 246, MAV_CMD_OVERRIDE_GOTO: 252, MAV_CMD_OBLIQUE_SURVEY: 260, MAV_CMD_DO_SET_STANDARD_MODE: 262, MAV_CMD_MISSION_START: 300, MAV_CMD_ACTUATOR_TEST: 310, MAV_CMD_CONFIGURE_ACTUATOR: 311, MAV_CMD_COMPONENT_ARM_DISARM: 400, MAV_CMD_RUN_PREARM_CHECKS: 401, MAV_CMD_ILLUMINATOR_ON_OFF: 405, MAV_CMD_DO_ILLUMINATOR_CONFIGURE: 406, MAV_CMD_GET_HOME_POSITION: 410, MAV_CMD_INJECT_FAILURE: 420, MAV_CMD_START_RX_PAIR: 500, MAV_CMD_GET_MESSAGE_INTERVAL: 510, MAV_CMD_SET_MESSAGE_INTERVAL: 511, MAV_CMD_REQUEST_MESSAGE: 512, MAV_CMD_REQUEST_PROTOCOL_VERSION: 519, MAV_CMD_REQUEST_AUTOPILOT_CAPABILITIES: 520, MAV_CMD_REQUEST_CAMERA_INFORMATION: 521, MAV_CMD_REQUEST_CAMERA_SETTINGS: 522, MAV_CMD_REQUEST_STORAGE_INFORMATION: 525, MAV_CMD_STORAGE_FORMAT: 526, MAV_CMD_REQUEST_CAMERA_CAPTURE_STATUS: 527, MAV_CMD_REQUEST_FLIGHT_INFORMATION: 528, MAV_CMD_RESET_CAMERA_SETTINGS: 529, MAV_CMD_SET_CAMERA_MODE: 530, MAV_CMD_SET_CAMERA_ZOOM: 531, MAV_CMD_SET_CAMERA_FOCUS: 532, MAV_CMD_SET_STORAGE_USAGE: 533, MAV_CMD_SET_CAMERA_SOURCE: 534, MAV_CMD_JUMP_TAG: 600, MAV_CMD_DO_JUMP_TAG: 601, MAV_CMD_DO_GIMBAL_MANAGER_PITCHYAW: 1000, MAV_CMD_DO_GIMBAL_MANAGER_CONFIGURE: 1001, MAV_CMD_IMAGE_START_CAPTURE: 2000, MAV_CMD_IMAGE_STOP_CAPTURE: 2001, MAV_CMD_REQUEST_CAMERA_IMAGE_CAPTURE: 2002, MAV_CMD_DO_TRIGGER_CONTROL: 2003, MAV_CMD_CAMERA_TRACK_POINT: 2004, MAV_CMD_CAMERA_TRACK_RECTANGLE: 2005, MAV_CMD_CAMERA_STOP_TRACKING: 2010, MAV_CMD_VIDEO_START_CAPTURE: 2500, MAV_CMD_VIDEO_STOP_CAPTURE: 2501, MAV_CMD_VIDEO_START_STREAMING: 2502, MAV_CMD_VIDEO_STOP_STREAMING: 2503, MAV_CMD_REQUEST_VIDEO_STREAM_INFORMATION: 2504, MAV_CMD_REQUEST_VIDEO_STREAM_STATUS: 2505, 
        MAV_CMD_LOGGING_START: 2510, MAV_CMD_LOGGING_STOP: 2511, MAV_CMD_AIRFRAME_CONFIGURATION: 2520, MAV_CMD_CONTROL_HIGH_LATENCY: 2600, MAV_CMD_PANORAMA_CREATE: 2800, MAV_CMD_DO_VTOL_TRANSITION: 3000, MAV_CMD_ARM_AUTHORIZATION_REQUEST: 3001, MAV_CMD_SET_GUIDED_SUBMODE_STANDARD: 4000, MAV_CMD_SET_GUIDED_SUBMODE_CIRCLE: 4001, MAV_CMD_CONDITION_GATE: 4501, MAV_CMD_NAV_FENCE_RETURN_POINT: 5000, MAV_CMD_NAV_FENCE_POLYGON_VERTEX_INCLUSION: 5001, MAV_CMD_NAV_FENCE_POLYGON_VERTEX_EXCLUSION: 5002, MAV_CMD_NAV_FENCE_CIRCLE_INCLUSION: 5003, MAV_CMD_NAV_FENCE_CIRCLE_EXCLUSION: 5004, MAV_CMD_NAV_RALLY_POINT: 5100, MAV_CMD_UAVCAN_GET_NODE_INFO: 5200, MAV_CMD_DO_SET_SAFETY_SWITCH_STATE: 5300, MAV_CMD_DO_ADSB_OUT_IDENT: 10001, MAV_CMD_PAYLOAD_PREPARE_DEPLOY: 30001, MAV_CMD_PAYLOAD_CONTROL_DEPLOY: 30002, MAV_CMD_FIXED_MAG_CAL_YAW: 42006, MAV_CMD_DO_WINCH: 42600, MAV_CMD_GUIDED_CHANGE_SPEED: 43000, MAV_CMD_GUIDED_CHANGE_ALTITUDE: 43001, MAV_CMD_GUIDED_CHANGE_HEADING: 43002, MAV_CMD_EXTERNAL_POSITION_ESTIMATE: 43003, MAV_CMD_WAYPOINT_USER_1: 31000, MAV_CMD_WAYPOINT_USER_2: 31001, MAV_CMD_WAYPOINT_USER_3: 31002, MAV_CMD_WAYPOINT_USER_4: 31003, MAV_CMD_WAYPOINT_USER_5: 31004, MAV_CMD_SPATIAL_USER_1: 31005, MAV_CMD_SPATIAL_USER_2: 31006, MAV_CMD_SPATIAL_USER_3: 31007, MAV_CMD_SPATIAL_USER_4: 31008, MAV_CMD_SPATIAL_USER_5: 31009, MAV_CMD_USER_1: 31010, MAV_CMD_USER_2: 31011, MAV_CMD_USER_3: 31012, MAV_CMD_USER_4: 31013, MAV_CMD_USER_5: 31014, MAV_CMD_CAN_FORWARD: 32000 }
  MAV_PARAM_TYPE:
    type: u8
    description: Specifies the datatype of a MAVLink parameter.
    values: { MAV_PARAM_TYPE_UINT8: 1, MAV_PARAM_TYPE_INT8: 2, MAV_PARAM_TYPE_UINT16: 3, MAV_PARAM_TYPE_INT16: 4, MAV_PARAM_TYPE_UINT32: 5, MAV_PARAM_TYPE_INT32: 6, MAV_PARAM_TYPE_UINT64: 7, MAV_PARAM_TYPE_INT64: 8, MAV_PARAM_TYPE_REAL32: 9, MAV_PARAM_TYPE_REAL64: 10 }
  MAV_RESULT:
    type: u8
    description: Result from a MAVLink command (MAV_CMD)
    values: { MAV_RESULT_ACCEPTED: 0, MAV_RESULT_TEMPORARILY_REJECTED: 1, MAV_RESULT_DENIED: 2, MAV_RESULT_UNSUPPORTED: 3, MAV_RESULT_FAILED: 4, MAV_RESULT_IN_PROGRESS: 5, MAV_RESULT_COMMAND_LONG_ONLY: 7, MAV_RESULT_COMMAND_INT_ONLY: 8 }
  MAV_SEVERITY:
    type: u8
    description: 'Indicates the severity level, generally used for status messages to indicate their relative urgency. Based on RFC-5424 using expanded definitions at: http://www.kiwisyslog.com/kb/info:-syslog-message-levels/.'
    values: { MAV_SEVERITY_EMERGENCY: 0, MAV_SEVERITY_ALERT: 1, MAV_SEVERITY_CRITICAL: 2, MAV_SEVERITY_ERROR: 3, MAV_SEVERITY_WARNING: 4, MAV_SEVERITY_NOTICE: 5, MAV_SEVERITY_INFO: 6, MAV_SEVERITY_DEBUG: 7 }
