schema_version: 1
project: mavlink_import
version: "0.1.0"
description: MAVLink 2 messages imported from common.xml.
namespace: tests::mavlink
defaults:
  endian: little
  bit_order: lsb_first
  range_check:
    encode: true
    decode: true
user_includes:
  include_dirs: [app/include]
checksums:
  mavlinkCrc:
    algo: custom
    impl: mav2sum::Crc
    include: mav2sum/crc.hpp
    c_impl: mav2sum_crc
    c_include: mav2sum/crc.h
    size_bytes: 2
enums:
  MAV_AUTOPILOT:
    type: u8
    description: Micro air vehicle / autopilot classes. This identifies the individual model.
    values: { MAV_AUTOPILOT_GENERIC: 0, MAV_AUTOPILOT_RESERVED: 1, MAV_AUTOPILOT_SLUGS: 2, MAV_AUTOPILOT_ARDUPILOTMEGA: 3, MAV_AUTOPILOT_OPENPILOT: 4, MAV_AUTOPILOT_GENERIC_WAYPOINTS_ONLY: 5, MAV_AUTOPILOT_GENERIC_WAYPOINTS_AND_SIMPLE_NAVIGATION_ONLY: 6, MAV_AUTOPILOT_GENERIC_MISSION_FULL: 7, MAV_AUTOPILOT_INVALID: 8, MAV_AUTOPILOT_PPZ: 9, MAV_AUTOPILOT_UDB: 10, MAV_AUTOPILOT_FP: 11, MAV_AUTOPILOT_PX4: 12, MAV_AUTOPILOT_SMACCMPILOT: 13, MAV_AUTOPILOT_AUTOQUAD: 14, MAV_AUTOPILOT_ARMAZILA: 15, MAV_AUTOPILOT_AEROB: 16, MAV_AUTOPILOT_ASLUAV: 17, MAV_AUTOPILOT_SMARTAP: 18, MAV_AUTOPILOT_AIRRAILS: 19, MAV_AUTOPILOT_REFLEX: 20 }
  MAV_TYPE:
    type: u8
    description: MAVLINK component type reported in HEARTBEAT message. Flight controllers must report the type of the vehicle on which they are mounted (e.g. MAV_TYPE_OCTOROTOR). All other components must report a value appropriate for their type (e.g. a camera must use MAV_TYPE_CAMERA).
    values: { MAV_TYPE_GENERIC: 0, MAV_TYPE_FIXED_WING: 1, MAV_TYPE_QUADROTOR: 2, MAV_TYPE_COAXIAL: 3, MAV_TYPE_HELICOPTER: 4, MAV_TYPE_ANTENNA_TRACKER: 5, MAV_TYPE_GCS: 6, MAV_TYPE_AIRSHIP: 7, MAV_TYPE_FREE_BALLOON: 8, MAV_TYPE_ROCKET: 9, MAV_TYPE_GROUND_ROVER: 10, MAV_TYPE_SURFACE_BOAT: 11, MAV_TYPE_SUBMARINE: 12, MAV_TYPE_HEXAROTOR: 13, MAV_TYPE_OCTOROTOR: 14, MAV_TYPE_TRICOPTER: 15, MAV_TYPE_FLAPPING_WING: 16, MAV_TYPE_KITE: 17, MAV_TYPE_ONBOARD_CONTROLLER: 18, MAV_TYPE_VTOL_DUOROTOR: 19, MAV_TYPE_VTOL_QUADROTOR: 20, MAV_TYPE_VTOL_TILTROTOR: 21, MAV_TYPE_VTOL_RESERVED2: 22, MAV_TYPE_VTOL_RESERVED3: 23, MAV_TYPE_VTOL_RESERVED4: 24, MAV_TYPE_VTOL_RESERVED5: 25, MAV_TYPE_GIMBAL: 26, MAV_TYPE_ADSB: 27, MAV_TYPE_PARAFOIL: 28, MAV_TYPE_DODECAROTOR: 29, MAV_TYPE_CAMERA: 30, MAV_TYPE_CHARGING_STATION: 31, MAV_TYPE_FLARM: 32, MAV_TYPE_SERVO: 33, MAV_TYPE_ODID: 34, MAV_TYPE_DECAROTOR: 35, MAV_TYPE_BATTERY: 36, MAV_TYPE_PARACHUTE: 37, MAV_TYPE_LOG: 38, MAV_TYPE_OSD: 39, MAV_TYPE_IMU: 40, MAV_TYPE_GPS: 41, MAV_TYPE_WINCH: 42, MAV_TYPE_GENERIC_MULTIROTOR: 43, MAV_TYPE_ILLUMINATOR: 44, MAV_TYPE_SPACECRAFT_ORBITER: 45, MAV_TYPE_GROUND_QUADRUPED: 46, MAV_TYPE_VTOL_GYRODYNE: 47, MAV_TYPE_GRIPPER: 48 }
  MAV_MODE_FLAG:
    type: u8
    description: These flags encode the MAV mode, see MAV_MODE enum for useful combinations.
    values: { MAV_MODE_FLAG_SAFETY_ARMED: 128, MAV_MODE_FLAG_MANUAL_INPUT_ENABLED: 64, MAV_MODE_FLAG_HIL_ENABLED: 32, MAV_MODE_FLAG_STABILIZE_ENABLED: 16, MAV_MODE_FLAG_GUIDED_ENABLED: 8, MAV_MODE_FLAG_AUTO_ENABLED: 4, MAV_MODE_FLAG_TEST_ENABLED: 2, MAV_MODE_FLAG_CUSTOM_MODE_ENABLED: 1 }
  MAV_STATE:
    type: u8
    values: { MAV_STATE_UNINIT: 0, MAV_STATE_BOOT: 1, MAV_STATE_CALIBRATING: 2, MAV_STATE_STANDBY: 3, MAV_STATE_ACTIVE: 4, MAV_STATE_CRITICAL: 5, MAV_STATE_EMERGENCY: 6, MAV_STATE_POWEROFF: 7, MAV_STATE_FLIGHT_TERMINATION: 8 }
  MAV_SYS_STATUS_SENSOR:
    type: u32
    description: These encode the sensors whose status is sent as part of the SYS_STATUS message.
    values: { MAV_SYS_STATUS_SENSOR_3D_GYRO: 1, MAV_SYS_STATUS_SENSOR_3D_ACCEL: 2, MAV_SYS_STATUS_SENSOR_3D_MAG: 4, MAV_SYS_STATUS_SENSOR_ABSOLUTE_PRESSURE: 8, MAV_SYS_STATUS_SENSOR_DIFFERENTIAL_PRESSURE: 16, MAV_SYS_STATUS_SENSOR_GPS: 32, MAV_SYS_STATUS_SENSOR_OPTICAL_FLOW: 64, MAV_SYS_STATUS_SENSOR_VISION_POSITION: 128, MAV_SYS_STATUS_SENSOR_LASER_POSITION: 256, MAV_SYS_STATUS_SENSOR_EXTERNAL_GROUND_TRUTH: 512, MAV_SYS_STATUS_SENSOR_ANGULAR_RATE_CONTROL: 1024, MAV_SYS_STATUS_SENSOR_ATTITUDE_STABILIZATION: 2048, MAV_SYS_STATUS_SENSOR_YAW_POSITION: 4096, MAV_SYS_STATUS_SENSOR_Z_ALTITUDE_CONTROL: 8192, MAV_SYS_STATUS_SENSOR_XY_POSITION_CONTROL: 16384, MAV_SYS_STATUS_SENSOR_MOTOR_OUTPUTS: 32768, MAV_SYS_STATUS_SENSOR_RC_RECEIVER: 65536, MAV_SYS_STATUS_SENSOR_3D_GYRO2: 131072, MAV_SYS_STATUS_SENSOR_3D_ACCEL2: 262144, MAV_SYS_STATUS_SENSOR_3D_MAG2: 524288, MAV_SYS_STATUS_GEOFENCE: 1048576, MAV_SYS_STATUS_AHRS: 2097152, MAV_SYS_STATUS_TERRAIN: 4194304, MAV_SYS_STATUS_REVERSE_MOTOR: 8388608, MAV_SYS_STATUS_LOGGING: 16777216, MAV_SYS_STATUS_SENSOR_BATTERY: 33554432, MAV_SYS_STATUS_SENSOR_PROXIMITY: 67108864, MAV_SYS_STATUS_SENSOR_SATCOM: 134217728, MAV_SYS_STATUS_PREARM_CHECK: 268435456, MAV_SYS_STATUS_OBSTACLE_AVOIDANCE: 536870912, MAV_SYS_STATUS_SENSOR_PROPULSION: 1073741824, MAV_SYS_STATUS_EXTENSION_USED: 2147483648 }
  MAV_SYS_STATUS_SENSOR_EXTENDED:
    type: u8
    description: These encode the sensors whose status is sent as part of the SYS_STATUS message in the extended fields.
    values: { MAV_SYS_STATUS_RECOVERY_SYSTEM: 1, MAV_SYS_STATUS_SENSOR_LEAK: 2 }
  MAV_FRAME:
    type: u8
    description: 'Coordinate frames used by MAVLink. Not all frames are supported by all commands, messages, or vehicles. Global frames use the following naming conventions: - "GLOBAL": Global coordinate frame with WGS84 latitude/longitude and altitude positive over mean sea level (MSL) by default. The following modifiers may be used with "GLOBAL": - "RELATIVE_ALT": Altitude is relative to the vehicle home position rather than MSL. - "TERRAIN_ALT": Altitude is relative to ground level rather than MSL. - "INT": Latitude/longitude (in degrees) are scaled by multiplying by 1E7. Local frames use the following naming conventions: - "LOCAL": Origin of local frame is fixed relative to earth. Unless otherwise specified this origin is the origin of the vehicle position-estimator ("EKF"). - "BODY": Origin of local frame travels with the vehicle. NOTE, "BODY" does NOT indicate alignment of frame axis with vehicle attitude. - "OFFSET": Deprecated synonym for "BODY" (origin travels with the vehicle). Not to be used for new frames. Some deprecated frames do not follow these conventions (e.g. MAV_FRAME_BODY_NED and MAV_FRAME_BODY_OFFSET_NED).'
    values: { MAV_FRAME_GLOBAL: 0, MAV_FRAME_LOCAL_NED: 1, MAV_FRAME_MISSION: 2, MAV_FRAME_GLOBAL_RELATIVE_ALT: 3, MAV_FRAME_LOCAL_ENU: 4, MAV_FRAME_GLOBAL_INT: 5, MAV_FRAME_GLOBAL_RELATIVE_ALT_INT: 6, MAV_FRAME_LOCAL_OFFSET_NED: 7, MAV_FRAME_BODY_NED: 8, MAV_FRAME_BODY_OFFSET_NED: 9, MAV_FRAME_GLOBAL_TERRAIN_ALT: 10, MAV_FRAME_GLOBAL_TERRAIN_ALT_INT: 11, MAV_FRAME_BODY_FRD: 12, MAV_FRAME_RESERVED_13: 13, MAV_FRAME_RESERVED_14: 14, MAV_FRAME_RESERVED_15: 15, MAV_FRAME_RESERVED_16: 16, MAV_FRAME_RESERVED_17: 17, MAV_FRAME_RESERVED_18: 18, MAV_FRAME_RESERVED_19: 19, MAV_FRAME_LOCAL_FRD: 20, MAV_FRAME_LOCAL_FLU: 21 }
  MAV_CMD:
    type: u16
    description: "Commands to be executed by the MAV. They can be executed on user request, or as part of a mission script. If the action is used in a mission, the parameter mapping to the waypoint/mission message is as follows: Param 1, Param 2, Param 3, Param 4, X: Param 5, Y:Param 6, Z:Param 7. This command list is similar what ARINC 424 is for commercial aircraft: A data format how to interpret waypoint/mission data. NaN and INT32_MAX may be used in float/integer params (respectively) to indicate optional/default values (e.g. to use the component's current yaw or latitude rather than a specific value). See https://mavlink.io/en/guide/xml_schema.html#MAV_CMD for information about the structure of the MAV_CMD entries"
