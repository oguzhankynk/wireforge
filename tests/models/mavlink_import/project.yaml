messages:
  Heartbeat:
    id: 0
    description: The heartbeat message shows that a system or component is present and responding. The type and autopilot fields (along with the message component id), allow the receiving system to treat further messages from this system appropriately (e.g. by laying out the user interface based on the autopilot). This microservice is documented at https://mavlink.io/en/services/heartbeat.html
    fields:
      - { name: customMode, type: u32, description: A bitfield for use for autopilot-specific flags }
      - { name: type, type: u8, description: 'Vehicle or component type. For a flight controller component the vehicle type (quadrotor, helicopter, etc.). For other components the component type (e.g. camera, gimbal, etc.). This should be used in preference to component id for identifying the component type. (enum MAV_TYPE)' }
      - { name: autopilot, type: u8, description: Autopilot type / class. Use MAV_AUTOPILOT_INVALID for components that are not flight controllers. (enum MAV_AUTOPILOT) }
      - { name: baseMode, type: u8, description: System mode bitmap. (enum MAV_MODE_FLAG) }
      - { name: systemStatus, type: u8, description: System status flag. (enum MAV_STATE) }
      - { name: mavlinkVersion, type: u8, const: 3, description: 'MAVLink version, not writable by user, gets added by protocol because of magic data type: uint8_t_mavlink_version' }
  SysStatus:
    id: 1
    description: Sensor and subsystem status information. Provides a compact representation of sensor/subsystem status and a few other basic statistics.
    fields:
      - { name: onboardControlSensorsPresent, type: u32, description: 'Bitmap showing which onboard controllers and sensors are present. Value of 0: not present. Value of 1: present. (enum MAV_SYS_STATUS_SENSOR)' }
      - { name: onboardControlSensorsEnabled, type: u32, description: 'Bitmap showing which onboard controllers and sensors are enabled: Value of 0: not enabled. Value of 1: enabled. (enum MAV_SYS_STATUS_SENSOR)' }
      - { name: onboardControlSensorsHealth, type: u32, description: 'Bitmap showing which onboard controllers and sensors have an error (or are operational). Value of 0: error. Value of 1: healthy. (enum MAV_SYS_STATUS_SENSOR)' }
      - { name: load, type: u16, units: d%, description: 'Maximum usage in percent of the mainloop time. Values: [0-1000] - should always be below 1000' }
      - { name: voltageBattery, type: u16, units: mV, description: 'Battery voltage, UINT16_MAX: Voltage not sent by autopilot. Value is ambiguous on multi-battery systems. BATTERY_STATUS is a recommended alternative.' }
      - { name: currentBattery, type: i16, units: cA, description: 'Battery current, -1: Current not sent by autopilot. Value may overflow/rollover for very high currents (> 327.67A). Value is ambiguous on multi-battery systems. BATTERY_STATUS is a recommended alternative.' }
      - { name: dropRateComm, type: u16, units: c%, description: 'Communication drop rate, (UART, I2C, SPI, CAN), dropped packets on all links (packets that were corrupted on reception on the MAV)' }
      - { name: errorsComm, type: u16, description: 'Communication errors (UART, I2C, SPI, CAN), dropped packets on all links (packets that were corrupted on reception on the MAV)' }
      - { name: errorsCount1, type: u16, description: Autopilot-specific errors }
      - { name: errorsCount2, type: u16, description: Autopilot-specific errors }
      - { name: errorsCount3, type: u16, description: Autopilot-specific errors }
      - { name: errorsCount4, type: u16, description: Autopilot-specific errors }
      - { name: batteryRemaining, type: i8, units: '%', description: 'Battery energy remaining, -1: Battery remaining energy not sent by autopilot. Value is ambiguous on multi-battery systems. BATTERY_STATUS is a recommended alternative.' }
      - { name: onboardControlSensorsPresentExtended, type: u32, description: 'Bitmap showing which onboard controllers and sensors are present. Value of 0: not present. Value of 1: present. (enum MAV_SYS_STATUS_SENSOR_EXTENDED) (extension)' }
      - { name: onboardControlSensorsEnabledExtended, type: u32, description: 'Bitmap showing which onboard controllers and sensors are enabled: Value of 0: not enabled. Value of 1: enabled. (enum MAV_SYS_STATUS_SENSOR_EXTENDED) (extension)' }
      - { name: onboardControlSensorsHealthExtended, type: u32, description: 'Bitmap showing which onboard controllers and sensors have an error (or are operational). Value of 0: error. Value of 1: healthy. (enum MAV_SYS_STATUS_SENSOR_EXTENDED) (extension)' }
  ParamValue:
    id: 22
    description: Emit the value of a onboard parameter. The inclusion of param_count and param_index in the message allows the recipient to keep track of received parameters and allows him to re-request missing parameters after a loss or timeout. The parameter microservice is documented at https://mavlink.io/en/services/parameter.html
    fields:
      - { name: paramValue, type: f32, description: Onboard parameter value }
      - { name: paramCount, type: u16, description: Total number of onboard parameters }
      - { name: paramIndex, type: u16, description: Index of this onboard parameter }
      - name: paramId
        type: char
        occurs: { max: 16 }
        description: Onboard parameter id, terminated by NULL if the length is less than 16 human-readable chars and WITHOUT null termination (NULL) byte if the length is exactly 16 chars - applications have to provide 16+1 bytes storage if the ID is stored as string
      - { name: paramType, type: u8, description: Onboard parameter type. (enum MAV_PARAM_TYPE) }
  GpsRawInt:
    id: 24
    description: The global position, as returned by the Global Positioning System (GPS). This is NOT the global position estimate of the system, but rather a RAW sensor value. See message GLOBAL_POSITION_INT for the global position estimate.
    fields:
      - { name: timeUsec, type: u64, units: us, description: Timestamp (UNIX Epoch time or time since system boot). The receiving end can infer timestamp format (since 1.1.1970 or since system boot) by checking for the magnitude of the number. }
      - { name: lat, type: i32, units: degE7, description: 'Latitude (WGS84, EGM96 ellipsoid)' }
      - { name: lon, type: i32, units: degE7, description: 'Longitude (WGS84, EGM96 ellipsoid)' }
      - { name: alt, type: i32, units: mm, description: Altitude (MSL). Positive for up. Note that virtually all GPS modules provide the MSL altitude in addition to the WGS84 altitude. }
      - { name: eph, type: u16, description: 'GPS HDOP horizontal dilution of position (unitless * 100). If unknown, set to: UINT16_MAX' }
      - { name: epv, type: u16, description: 'GPS VDOP vertical dilution of position (unitless * 100). If unknown, set to: UINT16_MAX' }
      - { name: vel, type: u16, units: cm/s, description: 'GPS ground speed. If unknown, set to: UINT16_MAX' }
      - { name: cog, type: u16, units: cdeg, description: 'Course over ground (NOT heading, but direction of movement) in degrees * 100, 0.0..359.99 degrees. If unknown, set to: UINT16_MAX' }
      - { name: fixType, type: u8, description: GPS fix type. (enum GPS_FIX_TYPE) }
      - { name: satellitesVisible, type: u8, description: 'Number of satellites visible. If unknown, set to UINT8_MAX' }
      - { name: altEllipsoid, type: i32, units: mm, description: 'Altitude (above WGS84, EGM96 ellipsoid). Positive for up. (extension)' }
      - { name: hAcc, type: u32, units: mm, description: Position uncertainty. (extension) }
      - { name: vAcc, type: u32, units: mm, description: Altitude uncertainty. (extension) }
      - { name: velAcc, type: u32, units: mm/s, description: Speed uncertainty. (extension) }
      - { name: hdgAcc, type: u32, units: degE5, description: Heading / track uncertainty (extension) }
      - { name: yaw, type: u16, units: cdeg, description: Yaw in earth frame from north. Use 0 if this GPS does not provide yaw. Use UINT16_MAX if this GPS is configured to provide yaw and is currently unable to provide it. Use 36000 for north. (extension) }
  AttitudeQuaternion:
    id: 31
    description: The attitude in the aeronautical frame (right-handed, Z-down, X-front, Y-right), expressed as quaternion. Quaternion order is w, x, y, z and a zero rotation would be expressed as (1 0 0 0).
    fields:
      - { name: timeBootMs, type: u32, units: ms, description: Timestamp (time since system boot). }
      - { name: q1, type: f32, description: 'Quaternion component 1, w (1 in null-rotation)' }
      - { name: q2, type: f32, description: 'Quaternion component 2, x (0 in null-rotation)' }
      - { name: q3, type: f32, description: 'Quaternion component 3, y (0 in null-rotation)' }
      - { name: q4, type: f32, description: 'Quaternion component 4, z (0 in null-rotation)' }
      - { name: rollspeed, type: f32, units: rad/s, description: Roll angular speed }
      - { name: pitchspeed, type: f32, units: rad/s, description: Pitch angular speed }
      - { name: yawspeed, type: f32, units: rad/s, description: Yaw angular speed }
      - name: reprOffsetQ
        type: f32
        occurs: { max: 4 }
        description: Rotation offset by which the attitude quaternion and angular speed vector should be rotated for user display (quaternion with [w, x, y, z] order, zero-rotation is [1, 0, 0, 0], send [0, 0, 0, 0] if field not supported). This field is intended for systems in which the reference attitude may change during flight. For example, tailsitters VTOLs rotate their reference attitude by 90 degrees between hover mode and fixed wing mode, thus repr_offset_q is equal to [1, 0, 0, 0] in hover mode and equal to [0.7071, 0, 0.7071, 0] in fixed wing mode. (extension)
  MissionItemInt:
    id: 73
    description: "Message encoding a mission item. This message is emitted to announce the presence of a mission item and to set a mission item on the system. The mission item can be either in x, y, z meters (type: LOCAL) or x:lat, y:lon, z:altitude. Local frame is Z-down, right handed (NED), global frame is Z-up, right handed (ENU). NaN or INT32_MAX may be used in float/integer params (respectively) to indicate optional/default values (e.g. to use the component's current latitude, yaw rather than a specific value). See also https://mavlink.io/en/services/mission.html."
    fields:
      - { name: param1, type: f32, description: 'PARAM1, see MAV_CMD enum' }
      - { name: param2, type: f32, description: 'PARAM2, see MAV_CMD enum' }
      - { name: param3, type: f32, description: 'PARAM3, see MAV_CMD enum' }
      - { name: param4, type: f32, description: 'PARAM4, see MAV_CMD enum' }
      - { name: x, type: i32, description: 'PARAM5 / local: x position in meters * 1e4, global: latitude in degrees * 10^7' }
      - { name: y, type: i32, description: 'PARAM6 / y position: local: x position in meters * 1e4, global: longitude in degrees *10^7' }
      - { name: z, type: f32, description: 'PARAM7 / z position: global: altitude in meters (relative or absolute, depending on frame.' }
      - { name: seq, type: u16, description: 'Waypoint ID (sequence number). Starts at zero. Increases monotonically for each waypoint, no gaps in the sequence (0,1,2,3,4).' }
      - { name: command, type: u16, description: The scheduled action for the waypoint. (enum MAV_CMD) }
      - { name: targetSystem, type: u8, description: System ID }
      - { name: targetComponent, type: u8, description: Component ID }
      - { name: frame, type: u8, description: The coordinate system of the waypoint. (enum MAV_FRAME) }
      - { name: current, type: u8, description: 'false:0, true:1' }
      - { name: autocontinue, type: u8, description: 'Autocontinue to next waypoint. 0: false, 1: true. Set false to pause mission after the item completes.' }
      - { name: missionType, type: u8, description: Mission type. (enum MAV_MISSION_TYPE) (extension) }
  CommandLong:
    id: 76
    description: Send a command with up to seven parameters to the MAV. COMMAND_INT is generally preferred when sending MAV_CMD commands that include positional information; it offers higher precision and allows the MAV_FRAME to be specified (which may otherwise be ambiguous, particularly for altitude). The command microservice is documented at https://mavlink.io/en/services/command.html
    fields:
      - { name: param1, type: f32, description: Parameter 1 (for the specific command). }
      - { name: param2, type: f32, description: Parameter 2 (for the specific command). }
      - { name: param3, type: f32, description: Parameter 3 (for the specific command). }
      - { name: param4, type: f32, description: Parameter 4 (for the specific command). }
      - { name: param5, type: f32, description: Parameter 5 (for the specific command). }
      - { name: param6, type: f32, description: Parameter 6 (for the specific command). }
      - { name: param7, type: f32, description: Parameter 7 (for the specific command). }
      - { name: command, type: u16, description: Command ID (of command to send). (enum MAV_CMD) }
      - { name: targetSystem, type: u8, description: System which should execute the command }
      - { name: targetComponent, type: u8, description: 'Component which should execute the command, 0 for all components' }
      - { name: confirmation, type: u8, description: '0: First transmission of this command. 1-255: Confirmation transmissions (e.g. for kill command)' }
  CommandAck:
    id: 77
    description: Report status of a command. Includes feedback whether the command was executed. The command microservice is documented at https://mavlink.io/en/services/command.html
    fields:
      - { name: command, type: u16, description: Command ID (of acknowledged command). (enum MAV_CMD) }
      - { name: result, type: u8, description: Result of command. (enum MAV_RESULT) }
      - { name: progress, type: u8, description: 'Also used as result_param1, it can be set with a enum containing the errors reasons of why the command was denied or the progress percentage or 255 if unknown the progress when result is MAV_RESULT_IN_PROGRESS. (extension)' }
      - { name: resultParam2, type: i32, description: 'Additional parameter of the result, example: which parameter of MAV_CMD_NAV_WAYPOINT caused it to be denied. (extension)' }
      - { name: targetSystem, type: u8, description: System which requested the command to be executed (extension) }
      - { name: targetComponent, type: u8, description: Component which requested the command to be executed (extension) }
  EncapsulatedData:
    id: 131
    description: 'Data packet for images sent using the Image Transmission Protocol: https://mavlink.io/en/services/image_transmission.html.'
    fields:
      - { name: seqnr, type: u16, description: sequence number (starting with 0 on every transmission) }
      - name: data
        type: u8
        occurs: { max: 253 }
        description: image data bytes
  Statustext:
    id: 253
    description: 'Status text message. These messages are printed in yellow in the COMM console of QGroundControl. WARNING: They consume quite some bandwidth, so use only for important status and error messages. If implemented wisely, these messages are buffered on the MCU and sent only at a limited rate (e.g. 10 Hz).'
    fields:
      - { name: severity, type: u8, description: Severity of status. Relies on the definitions within RFC-5424. (enum MAV_SEVERITY) }
      - name: text
        type: char
        occurs: { max: 50 }
        description: Status text message, without null termination character. UTF-8 encoded.
      - { name: id, type: u16, description: Unique (opaque) identifier for this statustext message. May be used to reassemble a logical long-statustext message from a sequence of chunks. A value of zero indicates this is the only chunk in the sequence and the message can be emitted immediately. (extension) }
      - { name: chunkSeq, type: u8, description: This chunk's sequence number; indexing is from zero. Any null character in the text field is taken to mean this was the last chunk. (extension) }
interfaces:
  link:
    version: 1.0.0
    direction: both
    header:
      fields:
        - { name: start, type: u8, const: 253, role: sync }
        - { name: length, type: u8, role: payload_length }
        - { name: incompatFlags, type: u8, const: 0, description: Signed frames (0x01) are refused. }
        - { name: compatFlags, type: u8 }
        - { name: sequence, type: u8, role: sequence }
        - { name: systemId, type: u8, default: 1 }
        - { name: componentId, type: u32, bits: 8, default: 1 }
        - { name: messageId, type: u32, bits: 24, role: message_id }
    trailer:
      fields:
        - name: checksum
          type: u16
          checksum:
            use: mavlinkCrc
            covers:
              scope: header_and_payload
    framing:
      kind: sync_length
      max_frame_size: 267
      resync: true
    trim_trailing_zeros: true
    messages: [Heartbeat, SysStatus, ParamValue, GpsRawInt, AttitudeQuaternion, MissionItemInt, CommandLong, CommandAck, EncapsulatedData, Statustext]
