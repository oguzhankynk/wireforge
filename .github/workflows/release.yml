name: release
# A tag v<version> (the version of wireforge/__init__.py) builds the wheel and the source
# distribution with the built UI, checks them, writes the SBOM and the audit of the dependencies and
# creates a GitHub release. Uploading to PyPI is a separate job that runs only when the repository
# variable PUBLISH_TO_PYPI is "true" and the environment "pypi" approves it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd ui && npm ci && npx vite build
      - run: pip install -e . build cyclonedx-bom pip-audit
      - name: The tag names the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(python -c 'import wireforge; print(wireforge.__version__)')"
      - run: python3 quality/check_dist.py
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build -o dist .
      - name: SBOM and audit of the installed dependencies
        run: |
          python -m venv sbom-env
          sbom-env/bin/pip install --quiet dist/*.whl
          cyclonedx-py environment --of JSON -o dist/wireforge-sbom.cdx.json sbom-env
          sbom-env/bin/pip freeze --exclude wireforge > dist/wireforge-requirements.txt
          pip-audit -r dist/wireforge-requirements.txt --no-deps --disable-pip \
            --format json --output dist/wireforge-pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dist, path: dist }

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      # Only the wheel and the source distribution go to PyPI, not the SBOM or the audit.
      - run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
      - uses: pypa/gh-action-pypi-publish@release/v1
