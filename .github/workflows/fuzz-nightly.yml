name: fuzz-nightly
# Long fuzzing of every target, started by hand; pull requests run the same targets for 60 s each
# (ci.yml).
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "900"

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - run: pip install -e .
      - run: quality/run_fuzz.sh
        env: { WIREFORGE_FUZZ_SECONDS: "${{ inputs.seconds || '900' }}" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: fuzz-artifacts, path: build/fuzz/artifacts }
