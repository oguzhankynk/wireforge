name: WireForge check
description: >-
  Checks a WireForge wire-format project in CI: validation, wire compatibility with the pull request
  base, and the generated tests. The summary appears on the run.
author: WireForge
branding:
  icon: check-circle
  color: blue
inputs:
  project:
    description: Project directory (or project.yaml) in the checked-out repository.
    default: "."
  base:
    description: >-
      Git revision to compare with. Defaults to the base commit of a pull request; empty on other
      events skips the comparison. The checkout needs the history (fetch-depth 0).
    default: ""
  test:
    description: Generate, build and run the tests of the generated code ("true" or "false").
    default: "true"
  plugins:
    description: Python file with the checksum plugins of the project, if it has custom checksums.
    default: ""
  python-version:
    description: Python used to run WireForge.
    default: "3.12"
  wireforge-version:
    description: >-
      Version of the wireforge package to install. Empty installs the version of this action
      (the ref you wrote after `uses:`), which is the reproducible choice.
    default: ""
  comment:
    description: Also post the summary as a comment on the pull request (needs pull-requests write).
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install WireForge
      shell: bash
      env:
        VERSION: ${{ inputs.wireforge-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [[ -n "${VERSION}" ]]; then
          pip install "wireforge==${VERSION}"
        else
          pip install "${ACTION_PATH}"
        fi
    - name: Check
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        RUN_TESTS: ${{ inputs.test }}
        PLUGINS: ${{ inputs.plugins }}
        COMMENT: ${{ inputs.comment }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        summary="${RUNNER_TEMP}/wireforge-summary.md"
        args=("${PROJECT}" --summary "${summary}" -o "${RUNNER_TEMP}/wireforge-ci")
        [[ -n "${BASE}" ]] && args+=(--base "${BASE}")
        [[ "${RUN_TESTS}" == "true" ]] && args+=(--test)
        [[ -n "${PLUGINS}" ]] && args+=(--plugins "${PLUGINS}")
        status=0
        wireforge ci "${args[@]}" || status=$?
        if [[ -f "${summary}" ]]; then
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${COMMENT}" == "true" && -n "${PULL_REQUEST}" ]]; then
            gh pr comment "${PULL_REQUEST}" --body-file "${summary}"
          fi
        fi
        exit "${status}"
